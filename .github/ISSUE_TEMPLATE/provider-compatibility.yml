name: Provider compatibility report
description: Report a provider version that works or fails with claude-watchdog.
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Provider formats may change without notice. Do not upload real JSONL transcripts or SQLite databases. Use a minimal synthetic record when possible.
  - type: dropdown
    id: source
    attributes:
      label: Source
      options:
        - Claude Code
        - Configured Claude profile
        - Codex CLI/App
        - OMX
        - OpenCode
    validations:
      required: true
  - type: input
    id: provider-version
    attributes:
      label: Exact provider version
      description: Write unknown if the application does not expose a version.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS and Python versions
      placeholder: "macOS 15.6; Python 3.12.5"
    validations:
      required: true
  - type: input
    id: watchdog
    attributes:
      label: Watchdog version or commit
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Result
      options:
        - Works as expected
        - Activity is incorrect
        - Session discovery is incorrect
        - Metadata or hierarchy is incorrect
        - Watchdog exits with an error
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Describe the recognized or missing fields. Use placeholders for all private values.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach raw transcripts or databases and removed prompts, paths, session IDs, credentials, and project names.
          required: true
