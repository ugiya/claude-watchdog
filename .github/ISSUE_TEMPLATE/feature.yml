name: Feature request
description: Propose one focused improvement to claude-watchdog.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful result.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Activity and sleep implications
      description: Could this affect admission, quietness, wake assertions, or sleep requests?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no raw transcripts, private prompts, paths, session IDs, credentials, or project names.
          required: true
