name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python ${{ matrix.python }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_public.py
      - run: python scripts/check.py
      - run: python scripts/demo.py --write-assets
      - name: Verify reproducible demo assets
        run: git diff --exit-code -- docs/demo.svg docs/demo.cast

  macos:
    name: macOS lifecycle and terminal
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/check.py --integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: synthetic-terminal-evidence
          path: .omx/artifacts/dashboard-pty/
          if-no-files-found: ignore
          retention-days: 7

  verified:
    name: Required checks
    if: always()
    needs: [unit, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: test "$UNIT_RESULT" = success && test "$MACOS_RESULT" = success
